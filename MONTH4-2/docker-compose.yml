# Generated by make_container_files.py (Day 19).
name: rag-api

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]     # keeps conversation memory and rate-limit counters across restarts
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # no "ports": only the rag service (same private network) can reach Redis

  rag:
    build: .
    image: rag-api:local
    env_file:
      - .env                   # your keys and connection strings; read at run time, never copied into the image
    environment:               # these WIN over .env: inside the container the addresses are different
      RAG_HOST: 0.0.0.0
      RAG_PORT: "8000"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:${RAG_HOST_PORT:-8080}:8000"    # only this computer can reach it. Change later when you deploy.
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - models:/models
      - checkpoints:/app/checkpoints
    init: true                 # a tiny init process: passes Ctrl+C / docker stop to Python and cleans up
    restart: unless-stopped
    stop_grace_period: 150s    # longer than RAG_REQUEST_TIMEOUT_SECONDS (120): a request in progress finishes before the stop
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }      # logs cannot fill the disk

  proxy:                       # Day 21: the front door. Only POST /ask and GET /healthz get through; see Caddyfile
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${RAG_DOOR_PORT:-8088}:8080"    # still only this computer. The tunnel (below) reaches it over the private network
    depends_on:
      - rag
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]  # the caddy program carries this one permission on its file; with ALL dropped it refuses to even start
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:                      # OPTIONAL, off unless you ask for it:  docker compose --profile tunnel up -d
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://proxy:8080"]
    profiles: ["tunnel"]
    depends_on:
      - proxy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  watchdog:                    # Day 21: watches the API, the front door and the backups; sends alerts to your phone
    image: rag-api:local       # the same image as rag (no second build)
    command: ["python", "watchdog.py"]
    environment:               # ONLY what it needs, taken from .env. (rag's database passwords and the Groq key are not given to it)
      WATCH_API_URL: http://rag:8000
      WATCH_DOOR_URL: http://proxy:8080
      BACKUP_DIR: /backups
      RAG_METRICS_KEY: ${RAG_METRICS_KEY:?RAG_METRICS_KEY is missing from .env (run Day 20 Cell 4)}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NTFY_TOPIC_SECRET: ${NTFY_TOPIC_SECRET:-}
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      HEARTBEAT_URL_SECRET: ${HEARTBEAT_URL_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALERT_LABEL: ${ALERT_LABEL:-rag-api}
      ALERT_UTC_OFFSET_HOURS: ${ALERT_UTC_OFFSET_HOURS:-0}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-48}
      WATCH_COST_PER_HOUR_USD: ${WATCH_COST_PER_HOUR_USD:-}
      WATCH_SLOW_P95_SECONDS: ${WATCH_SLOW_P95_SECONDS:-}
      WATCH_MEMORY_GB: ${WATCH_MEMORY_GB:-}
      WATCH_DISK_FREE_GB: ${WATCH_DISK_FREE_GB:-}
      DRILL_MAX_AGE_DAYS: ${DRILL_MAX_AGE_DAYS:-}
      ALERT_REMIND_HOURS: ${ALERT_REMIND_HOURS:-}
      WATCH_DEBUG: ${WATCH_DEBUG:-}
    volumes:
      - ./backups:/backups:ro  # backup_tools.py writes here; the watchdog only READS it
    depends_on:
      - rag
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:               # (the image's own check looks for the API on port 8000; this one has no port)
      test: ["CMD", "python", "watchdog.py", "--selfcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  models:
  checkpoints:
  redis_data:
  caddy_data:
  caddy_config:
